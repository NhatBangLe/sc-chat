services:
  mysql:
    image: mysql:8.1
    container_name: chat-db
    ports:
      - "2706:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: chat_service
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 15s
      timeout: 15s
      retries: 3
    networks:
      - network
  chat-service:
    image: nhatbangle/sc-chat:latest
    restart: always
    container_name: chat-service
    ports:
      - "80:8080"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROFILE_ACTIVE: prod
      DB_HOST: mysql:3306
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: chat_service
      SWAGGER_SERVER_URL: http://gateway:80
      EXTERNAL_HOST: 127.0.0.1
      EXTERNAL_PORT: 80
    networks:
      - network
    volumes:
      - logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
volumes:
  db-data:
    name: chat-db
  logs:
    name: chat-logs
networks:
  network:
    name: chat-network