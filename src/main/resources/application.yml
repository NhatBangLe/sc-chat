spring:
  application:
    name: chat-service
  profiles:
    active: ${PROFILE_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${DB_HOST}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

chat:
  server-host: ${EXTERNAL_HOST:localhost}
  server-port: ${EXTERNAL_PORT:8080}

app:
  api-docs-server: ${SWAGGER_SERVER_URL:http://localhost:8080}